# Manual review decisions for pairs the automated checks flagged.
#
# [verified.<BASE>]  The pair was checked and may be scanned despite the listed flags. The decision holds only
#                    while (a) its flags are a subset of `accepted_flags` and (b) it passes the tradability check
#                    on every run. Any new flag, or failing tradability, sends it back to review automatically.
# [hold.<BASE>]      Kept in review (not scanned) until the stated question is answered.
#
# Decisions are based on measured evidence, never on the asset's name.

