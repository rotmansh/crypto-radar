# Manual review decisions for pairs the automated checks flagged.
#
# [verified.<BASE>]  The pair was checked and may be scanned despite the listed flags. The decision holds only
#                    while (a) its flags are a subset of `accepted_flags` and (b) it passes the tradability check
#                    on every run. Any new flag, or failing tradability, sends it back to review automatically.
# [hold.<BASE>]      Kept in review (not scanned) until the stated question is answered.
# [suspended.<BASE>] A documented temporary suspension. It never sets a status by itself: the pair stays out of the
#                    scan while the rule named in `lift_when` still holds, re-checked on every run, and returns
#                    automatically once it no longer does. Nothing here removes a coin permanently.
#                      liquidity_ok                  lifts when the liquidity persistence rule ([liquidity] in
#                                                    settings.toml: >=5 of the last 6 measurements over >=24h) clears
#                      asset_verified_and_liquidity_ok  additionally needs a [verified.<BASE>] decision first; until
#                                                    then the pair stays in review even if its flags disappear
#
# Decisions are based on measured evidence, never on the asset's name.

[verified.ZEC]
accepted_flags = ["permission_profile_anomaly"]
decided = "2026-10-27"
evidence = """Missing groups TRD_GRP_004/006/020 differ from the tokenized-equity pattern. Measured in runs
40462417068..40463572930: spread 0.0008%, ±1% depth $1.8M–5.2M per side, weekend/weekday volume 0.66,
30d range 40.8%, status TRADING with spot allowed. Re-verified by the tradability check on every run."""

[verified.DASH]
accepted_flags = ["permission_profile_anomaly"]
decided = "2026-10-27"
evidence = """Missing groups TRD_GRP_004/006 differ from the tokenized-equity pattern. Measured in runs
40462417068..40463572930: spread 0.04–0.05%, ±1% depth bid $98K–173K / ask $38K–59K, weekend/weekday volume 0.47,
30d range 41.3%, status TRADING with spot allowed. Re-verified by the tradability check on every run."""

