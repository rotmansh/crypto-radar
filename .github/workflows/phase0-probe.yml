name: "Phase 0 — data source probe"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "scripts/phase0_probe.py"
      - ".github/workflows/phase0-probe.yml"

permissions:
  contents: write

concurrency:
  group: radar-writer
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (offline)
        run: python -m pytest -q
      - name: Probe public market-data sources
        id: probe
        run: python scripts/phase0_probe.py
        continue-on-error: true
      - name: Commit report
        if: always()
        run: |
          git config user.name "crypto-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase0 data/universe || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Phase 0 probe report (run ${GITHUB_RUN_ID})"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if no usable source
        if: steps.probe.outcome != 'success'
        run: |
          echo "::error::No data source passed the probe — see reports/phase0/REPORT.md"
          exit 1
