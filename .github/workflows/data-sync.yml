name: "Data sync + scan"

# Every 4 hours, 23 minutes after each 4H candle closes (00:23, 04:23, ... 20:23 UTC), away from the top-of-hour
# peak when GitHub delays or drops scheduled runs; plus manual runs, runs dispatched by the watchdog
# (scan-watchdog.yml) when a slot was missed, and runs dispatched from outside GitHub at :25 by cron-job.org through
# the REST API (trigger=external_cron; claude_routine was tried and is not in use). Duplicates are skipped by the gate. The scan always evaluates the newest candle that has CLOSED at run
# time, and the sync waits and retries if the exchange has not yet published it. Open candles are never stored.
on:
  schedule:
    - cron: "23 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Who started this run"
        type: choice
        options: [manual, watchdog, claude_routine, external_cron]
        default: manual
      reason:
        description: "Why (filled in by the watchdog / routine)"
        type: string
        default: ""

permissions:
  contents: write

# One writer at a time; a run that arrives while another is in progress waits instead of overlapping.
concurrency:
  group: radar-writer
  cancel-in-progress: false

jobs:
  # Skip a scheduled/watchdog run whose slot already has a successful run (e.g. a schedule that arrives hours
  # late after the watchdog covered it). Manual runs always proceed. All safety checks stay in the sync job.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      trigger: ${{ steps.t.outputs.trigger }}
      decision: ${{ steps.g.outputs.decision }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the latest run records (an earlier run may have committed since this one was triggered)
        run: git fetch --depth=1 origin main && git checkout -B main FETCH_HEAD
      - id: t
        run: echo "trigger=${{ github.event_name == 'workflow_dispatch' && inputs.trigger || github.event_name }}" >> "$GITHUB_OUTPUT"
      - id: g
        env:
          DISPATCH_REASON: ${{ inputs.reason }}
        run: python scripts/slot_gate.py gate "${{ steps.t.outputs.trigger }}" >> "$GITHUB_OUTPUT"
      # A skipped run commits its decision here (no other writer runs: same concurrency group). A run that
      # proceeds leaves it to the sync job, which re-records the decision on the latest main.
      - name: Record a skipped run
        if: steps.g.outputs.run != 'true'
        run: |
          git config user.name "crypto-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health/gate-decisions.csv
          python scripts/check_append_only.py
          git commit -q -m "Gate skip (${{ steps.t.outputs.trigger }} run ${GITHUB_RUN_ID}): ${{ steps.g.outputs.reason }}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      status: ${{ steps.health.outputs.status }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Start from the latest main
        env:
          GATE_DECISION: ${{ needs.gate.outputs.decision }}
        run: |
          git fetch --depth=1 origin main && git checkout -B main FETCH_HEAD
          echo "RUN_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"
          python scripts/slot_gate.py record
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (offline)
        id: tests
        run: python -m pytest -q
      - name: Sync universe, liquidity and candle history
        id: sync
        run: python scripts/sync_data.py
        continue-on-error: true
      - name: Scan strategies on the latest closed candles
        id: scan
        if: always() && steps.tests.outcome == 'success'
        run: python scripts/scan.py
        continue-on-error: true
      - name: Record run health
        id: health
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          RUN_TRIGGER: ${{ needs.gate.outputs.trigger }}
          DISPATCH_REASON: ${{ inputs.reason }}
        run: |
          python scripts/health.py
          echo "status=$(python -c 'import json;print(json.load(open("data/health/latest.json"))["last_run"]["status"])')" >> "$GITHUB_OUTPUT"
      - name: Append-only check and commit
        if: always()
        run: |
          git config user.name "crypto-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports journal
          python scripts/check_append_only.py
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Data sync (${{ needs.gate.outputs.trigger }} run ${GITHUB_RUN_ID}, ${{ steps.health.outputs.status }})"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
      - name: Fail unless the run was a full success
        if: always() && steps.health.outputs.status != 'success'
        run: |
          echo "::error::run status=${{ steps.health.outputs.status }} sync=${{ steps.sync.outcome }} scan=${{ steps.scan.outcome }} — see data/health/latest.json"
          exit 1

  # Published even after a failed run, so the dashboard shows the failure instead of looking current.
  site:
    needs: sync
    if: always() && needs.sync.result != 'cancelled' && needs.sync.result != 'skipped'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml

  # Opens the published site and checks it serves THIS run's data, on a phone-sized and a desktop browser.
  verify:
    needs: [gate, sync, site]
    if: always() && needs.site.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Live check of the published dashboard
        id: live
        env:
          SCREENSHOTS: "0"
          EXPECT_RUN_ID: ${{ github.run_id }}
        run: node tests/live/site_check.js /tmp/site-check
        continue-on-error: true
      - name: Record and commit the check
        if: always()
        env:
          RUN_TRIGGER: ${{ needs.gate.outputs.trigger }}
        run: |
          python scripts/record_site_check.py /tmp/site-check/RESULT.json "${{ steps.live.outcome }}"
          git config user.name "crypto-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health
          git diff --cached --quiet && exit 0
          git commit -q -m "Dashboard live check (run ${GITHUB_RUN_ID}: ${{ steps.live.outcome }})"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
      - name: Fail if the live check failed
        if: steps.live.outcome != 'success'
        run: exit 1
