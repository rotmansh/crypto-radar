name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "reports/**", "docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Time Machine gateway tests (no future data in Replay)
        run: node --test tests/js/*.test.js
